<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keydown editor</title>
<style>body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; } #ed { min-height: 220px; border: 1px solid #cbd5e1; border-radius: 10px; padding: 14px; }</style>
</head>
<body>
<h1>Type some Keydown</h1>
<p>Try <code>#G#hello#</code> then a space, or <code>**bold**</code>.</p>
<div id="ed" data-keydown contenteditable></div>
<script src="../dist/Keydown.js"></script>
</body>
</html>
